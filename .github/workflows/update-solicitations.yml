name: Auto-Update DC Compact Solicitations

on:
  schedule:
    # Runs every Monday at 06:00 UTC (weekly check for new DC / PRH solicitations)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows one-click manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Catalog Scraper & Sorter
        run: |
          python update_compact_comics.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/compact_comics.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new changes to catalog."
          else
            git commit -m "chore(catalog): auto-update DC Compact Comics solicitations [skip ci]"
            git push
          fi
